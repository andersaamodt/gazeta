[package]
name = "gazeta-theurgy"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-OWL-3.1"
description = "Theurgy read runtime for Gazeta."

[[bin]]
name = "gazeta-read"
path = "src/bin/gazeta-read.rs"

[[bin]]
name = "gazeta-nostr-read"
path = "src/bin/gazeta-nostr-read.rs"

[[bin]]
name = "gazeta-commerce-read"
path = "src/bin/gazeta-commerce-read.rs"

[[bin]]
name = "gazeta-admin-read"
path = "src/bin/gazeta-admin-read.rs"

[[bin]]
name = "gazeta-admin"
path = "src/bin/gazeta-admin.rs"

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
itoa = "=1.0.14"
mime_guess = "=2.0.5"
ryu = "=1.0.20"
serde_json = "=1.0.140"
time = { version = "=0.3.41", features = ["formatting", "macros"] }

[package.metadata.theurgy.web_runtime]
track = "enterprise-web"
runtime = "theurgy-web"
truth = "file-first"
adapter = "cgi-compat"
phase = "gazeta-admin-mutation-runtime"
