<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paradoxes of Capitalism Quiz-for-Thought</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f3e8;
      --ink: #231f1a;
      --muted: #5f574d;
      --line: #cfc4ad;
      --accent: #7b3f22;
      --accent-strong: #4e2816;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.5;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      max-width: 70ch;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 24px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--accent-strong);
      background: var(--accent);
      color: #fff7ec;
      padding: 9px 13px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 700;
    }

    a.secondary {
      background: transparent;
      color: var(--accent-strong);
    }

    .form-frame {
      width: 100%;
      min-height: 76vh;
      border: 1px solid var(--line);
      background: white;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Paradoxes of Capitalism Quiz-for-Thought</h1>
      <p>This legacy quiz is preserved as the original Google Form used by the old Oeuvre listing.</p>
      <nav class="actions" aria-label="Quiz links">
        <a class="button" href="https://docs.google.com/forms/d/1J8VTFg_x-ND6xXB1QlkpuOF8uwO7oevaYSoj6qHydDc/viewform?usp=sf_link">Open quiz</a>
        <a class="button secondary" href="/oeuvre">Back to Oeuvre</a>
      </nav>
    </header>
    <iframe
      class="form-frame"
      title="Paradoxes of Capitalism Quiz-for-Thought"
      src="https://docs.google.com/forms/d/1J8VTFg_x-ND6xXB1QlkpuOF8uwO7oevaYSoj6qHydDc/viewform?embedded=true"
      loading="lazy">Loading...</iframe>
  </main>
</body>
</html>
