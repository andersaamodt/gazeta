<!DOCTYPE html>
<html lang="en" class="pieplate-booting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pieplate</title>
  <link rel="icon" href="assets/pieplate-icon.png" type="image/png">
  <link rel="preload" as="image" href="assets/pieplate-icon.png" fetchpriority="high">
  <style>
    :root {
      --boot-bg: #f4efe7;
      --boot-ink: #25313a;
    }

    html.pieplate-booting,
    html.pieplate-booting body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--boot-bg) !important;
      color: var(--boot-ink);
    }

    body.pieplate-booting .app-shell {
      visibility: hidden;
    }

    .boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--boot-bg);
      z-index: 20;
    }

    .boot-mark {
      width: 124px;
      height: 124px;
      display: block;
    }
  </style>
  <link rel="stylesheet" href="style.css?v=sidebars3">
</head>
<body class="pieplate-booting">
  <div id="boot-splash" class="boot-splash" aria-busy="true" aria-label="Loading Pieplate">
    <img class="boot-mark" src="assets/pieplate-icon.png" alt="" aria-hidden="true">
  </div>

  <main id="app-shell" class="app-shell hidden" aria-hidden="true">
    <div class="topbar">
      <div class="brand-lockup">
        <img src="assets/pieplate-icon.png" alt="" aria-hidden="true">
        <div>
          <h1>Pieplate</h1>
        </div>
        <p class="brand-quote"><span>That'll put marzipan in your pie plate, bingo!</span> <cite>&mdash;Buffybot</cite></p>
      </div>
      <div class="toolbar-actions" aria-label="Main actions">
        <label id="autosave-toggle-wrap" class="autosave-toggle hidden" title="Autosave desktop project folder">
          <input id="autosave-toggle" type="checkbox">
          <span>Autosave</span>
        </label>
        <button id="toggle-properties" type="button" class="icon-btn" title="Properties" aria-label="Toggle properties sidebar" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9"/><path d="M17 7h3"/><circle cx="15" cy="7" r="2"/><path d="M4 17h3"/><path d="M11 17h9"/><circle cx="9" cy="17" r="2"/></svg>
        </button>
        <button id="toggle-randomizer" type="button" class="icon-btn" title="Randomization" aria-label="Toggle randomization sidebar" aria-pressed="false">
          <svg class="dice-icon dice-icon-pair" viewBox="0 0 24 24" aria-hidden="true">
            <path class="die-side" d="M9 4.5l6 2.4v7.2l-6-2.7z"/>
            <path class="die-top" d="M3.5 7.1L9 4.5l6 2.4-5.8 2.8z"/>
            <path class="die-front" d="M3.5 7.1l5.7 2.6L9 16.9l-5.5-2.8z"/>
            <circle class="pip" cx="7.3" cy="8.4" r="0.55"/>
            <circle class="pip" cx="11.4" cy="7" r="0.55"/>
            <circle class="pip" cx="6.1" cy="12.7" r="0.55"/>
            <circle class="pip" cx="10.3" cy="14.2" r="0.55"/>
            <path class="die-side alt" d="M16.2 9.3l4.6 1.9v5.7l-4.6-2.1z"/>
            <path class="die-top alt" d="M11.8 11.2l4.4-1.9 4.6 1.9-4.5 2.2z"/>
            <path class="die-front alt" d="M11.8 11.2l4.5 2.2-.1 5.6-4.4-2.1z"/>
            <circle class="pip" cx="14.1" cy="12.1" r="0.45"/>
            <circle class="pip" cx="17.7" cy="11.1" r="0.45"/>
            <circle class="pip" cx="14.1" cy="15.8" r="0.45"/>
            <circle class="pip" cx="18.2" cy="16.6" r="0.45"/>
          </svg>
        </button>
        <button id="toggle-key" type="button" class="icon-btn" title="Key" aria-label="Toggle key sidebar" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21"/><path d="M17 12v3"/><path d="M20 12v2"/></svg>
        </button>
        <button id="randomize-now" type="button" class="dice-btn" title="Randomize" aria-label="Generate random bingo card">
          <svg class="dice-icon die-icon-large" viewBox="0 0 24 24" aria-hidden="true">
            <path class="die-side" d="M12 3.2l7.1 3.2v9.4L12 20.8z"/>
            <path class="die-top" d="M4.9 6.4L12 3.2l7.1 3.2-7.1 3.7z"/>
            <path class="die-front" d="M4.9 6.4l7.1 3.7v10.7l-7.1-5z"/>
            <circle class="pip" cx="9.4" cy="7.2" r="0.72"/>
            <circle class="pip" cx="14.7" cy="5.9" r="0.72"/>
            <circle class="pip" cx="8.1" cy="13" r="0.78"/>
            <circle class="pip" cx="15.9" cy="10.7" r="0.74"/>
            <circle class="pip" cx="15.9" cy="15.7" r="0.74"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="workspace">
      <aside id="properties-sidebar" class="sidebar left-sidebar" aria-label="Properties" aria-hidden="true">
        <header class="sidebar-head">
          <h2>Properties</h2>
          <button type="button" class="icon-btn compact" data-close-sidebar="properties" aria-label="Close properties">x</button>
        </header>
        <label class="field-label" for="card-title">Title</label>
        <input id="card-title" class="text-input long" type="text" autocomplete="off">
        <label class="field-label" for="card-description">Description</label>
        <textarea id="card-description" class="text-input area" rows="5"></textarea>
        <section class="drawer-section project-section">
          <h3>Project</h3>
          <label class="field-label" for="project-name">Name</label>
          <input id="project-name" class="text-input long" type="text" autocomplete="off">
          <div class="project-actions">
            <button id="save-project" type="button" class="polite-btn primary">Save</button>
            <button id="download-project" type="button" class="polite-btn secondary">Download</button>
            <button id="open-project-file" type="button" class="polite-btn secondary">Open</button>
          </div>
          <label class="field-label saved-project-label" for="saved-projects">Saved folders</label>
          <div class="project-open-row">
            <select id="saved-projects" class="text-input"></select>
            <button id="open-saved-project" type="button" class="polite-btn secondary">Open Saved</button>
          </div>
          <p id="project-status" class="project-status"></p>
          <input id="project-file" class="hidden" type="file" accept=".pieplate.tar,.tar,application/x-tar">
        </section>
        <section class="drawer-section">
          <h3>Versions</h3>
          <div id="version-list" class="version-list" role="listbox" aria-label="Card versions"></div>
        </section>
      </aside>

      <section class="stage" aria-label="Bingo card editor">
        <button id="back-to-base" type="button" class="stage-action-btn stage-back-btn hidden" title="Back to base card" aria-label="Back to base bingo card">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="loop-arrow" d="M10 6.2H6.5v3.5"/>
            <path class="loop-arrow" d="M6.8 7.4a7 7 0 1 1-1 6.8"/>
            <path class="loop-arrow-fill" d="M5.1 13.8l1.2 4.1 3-3z"/>
          </svg>
        </button>
        <button id="print-current" type="button" class="stage-print-btn" title="Print" aria-label="Open print options">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V4h10v4"/><rect x="6" y="14" width="12" height="6" rx="1"/><path d="M6 17H4v-7h16v7h-2"/><path d="M8 6h8"/><circle cx="17" cy="12" r="1"/></svg>
        </button>
        <section class="print-sheet" id="print-sheet">
          <header class="card-copy">
            <h2 id="preview-title"></h2>
            <p id="preview-description"></p>
          </header>
          <div id="bingo-grid" class="bingo-grid" aria-label="Editable bingo card"></div>
        </section>
        <section id="print-key" class="print-key hidden" aria-label="Bingo key"></section>
        <section id="print-batch-output" class="print-batch-output hidden" aria-label="Prepared print sheets"></section>
      </section>

      <aside id="right-sidebar" class="sidebar right-sidebar" aria-label="Options" aria-hidden="true"></aside>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </main>

  <div id="image-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="image-modal-title">
    <section class="modal-panel">
      <header class="modal-head">
        <h2 id="image-modal-title">Place image</h2>
        <button id="cancel-image" type="button" class="icon-btn compact" aria-label="Cancel image placement">x</button>
      </header>
      <div id="image-crop-stage" class="image-crop-stage">
        <img id="crop-image" alt="">
      </div>
      <div class="modal-controls">
        <label class="field-label" for="image-zoom">Zoom</label>
        <input id="image-zoom" type="range" min="1" max="3" step="0.01">
        <button id="fit-image" type="button" class="polite-btn secondary">Fit</button>
        <button id="confirm-image" type="button" class="polite-btn primary">OK</button>
      </div>
    </section>
  </div>

  <script src="../.host/shared/wizardry-bridge.js"></script>
  <script src="script.js"></script>
</body>
</html>
