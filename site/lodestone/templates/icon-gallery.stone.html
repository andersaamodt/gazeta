<lode-page>
<section id="icon-gallery-root" class="list-page-shell icon-gallery-shell" data-list-slug={slug} data-list-title={title} data-page-type={page_type}{@html prerender_attrs}>
<div class="list-page-head"><h1 id="list-page-title"><span class="list-page-title-text">{title}</span><span id="list-page-title-actions" class="list-page-title-actions"></span><span data-page-nav-title-host="true" class="list-page-nav-title-row-wrap"></span></h1><p id="list-page-description" class="muted"{@html description_attrs}><span class="list-page-description-text">{@html description_html}</span></p></div>
<div id="list-page-admin" class="list-admin" hidden></div>
<div id="list-page-validation" class="list-validation" hidden></div>
<div id="list-page-content" class="list-page-content"{@html prerender_attrs}><gazeta-nostr-page-content page_type={page_type}>{@html content_html}</gazeta-nostr-page-content></div>
</section>

<script src="/static/nostr-page-bootstrap/{slug}.js"></script>
<script src="/static/nostr-publish-dialog.js"></script>
<script src="/static/list-page.js?v={list_page_js_version}"></script>
</lode-page>
