---
title: Blog
---

<lode-page>
<section id="blog-page-root" class="blog-page" data-blog-slug={slug} data-page-type={page_type} data-page-title={title} aria-live="polite"{@html prerender_attrs}>
<div class="blog-layout">
<div class="blog-main-column">
<div class="list-page-head">
<h1 id="blog-page-title"><span class="list-page-title-text">{title}</span><span id="blog-page-title-static-actions" class="list-page-title-static-actions"><button id="blog-filter-toggle" type="button" class="blog-filter-toggle unobtrusive-icon-button" aria-expanded="false" aria-controls="blog-filter-panel" aria-label="Filter posts" title="Filter posts"><svg class="blog-filter-icon" viewBox="0 0 16 16" aria-hidden="true"><line x1="2" y1="3" x2="14" y2="3"></line><circle cx="6" cy="3" r="1.25"></circle><line x1="2" y1="8" x2="14" y2="8"></line><circle cx="10.5" cy="8" r="1.25"></circle><line x1="2" y1="13" x2="14" y2="13"></line><circle cx="4.5" cy="13" r="1.25"></circle></svg></button></span><span id="blog-page-title-actions" class="list-page-title-actions"></span><span data-page-nav-title-host="true" class="list-page-nav-title-row-wrap"></span></h1>
<p id="blog-page-description" class="muted"{@html description_attrs}><span class="list-page-description-text">{@html description_html}</span></p>
<nav class="publication-resources" aria-label="Publication resources"{@html publication_links_attrs}><a href="/{slug}/archive">Archive</a><a href="/{slug}/rss.xml">RSS</a><a href="/{slug}/atom.xml">Atom</a></nav>
</div>
<div id="blog-draft-notice" class="blog-draft-notice" hidden></div>
<div id="blog-page-admin" class="list-admin" hidden></div>
<div id="blog-page-validation" class="list-validation" hidden></div>
<div id="blog-page-content" class="list-page-content"{@html content_attrs}{@html prerender_attrs}><gazeta-nostr-page-content page_type="blog">{@html content_html}</gazeta-nostr-page-content></div>
<div id="blog-filter-panel" class="blog-filter-panel" hidden>
<div class="blog-filter-grid">
<div class="blog-filter-group">
<h3>Tags</h3>
<div id="blog-filter-tags" class="blog-filter-options">{@html filter_tags_html}</div>
</div>
<div class="blog-filter-group">
<h3>Year</h3>
<div id="blog-filter-years" class="blog-filter-options">{@html filter_years_html}</div>
</div>
<div class="blog-filter-group">
<h3>Type</h3>
<div id="blog-filter-types" class="blog-filter-options">{@html filter_types_html}</div>
</div>
</div>
<div class="blog-filter-footer">
<button id="blog-clear-filters" type="button" class="blog-clear-filters">Clear filters</button>
</div>
</div>

<div id="blog-compose-slot" class="blog-compose-slot" hidden></div>
<div id="blog-post-list" class="post-list" data-gazeta-component="blog-post-list"{@html prerender_attrs}><gazeta-blog-post-list posts={posts_json}>{@html post_list_html}</gazeta-blog-post-list></div>
<p id="blog-empty" class="placeholder"{@html empty_attrs}>{empty_text}</p>
</div>
</div>
<button id="blog-compose-fab" type="button" class="blog-compose-fab list-admin-primary-btn" data-blog-action="toggle-compose" aria-label="Compose" hidden><span class="blog-compose-fab-icon" aria-hidden="true">+</span></button>
</section>

<script src="/static/nostr-page-bootstrap/{slug}.js"></script>
<script src="/static/compose-shared.js?v=20260403-compose1"></script>
<lode-script src="/static/blog-page.js?v={blog_page_js_version}" />
</lode-page>
